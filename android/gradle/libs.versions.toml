[versions]
agp = "8.9.1"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
composeBom = "2025.12.01"
activityCompose = "1.10.1"
navigationCompose = "2.8.9"
lifecycle = "2.8.7"
coroutines = "1.9.0"
serializationJson = "1.7.3"
junit5 = "5.11.4"
coreKtx = "1.15.0"
camerax = "1.4.1"
mediapipeTasksVision = "1.2.3"
opencv = "4.11.0"
room = "2.7.0"
sqlcipher = "4.20.0"
sqlite = "2.7.0"
work = "2.10.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
